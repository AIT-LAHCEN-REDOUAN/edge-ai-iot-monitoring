services:
  thingsboard:
    image: thingsboard/tb-postgres
    container_name: thingsboard
    environment:
      - TB_QUEUE_TYPE=in-memory
    ports:
      - "8080:8080"
      - "9090:9090"
      - "1883:1883"
      - "5683-5688:5683-5688"
    volumes:
      - ./tb-data:/data
      - ./tb-logs:/var/log/thingsboard
  vm1:
    build: .
    image: iot_project-vm1:latest
    container_name: vm1_container
    command: python scripts/vm_server.py
    environment:
      VM_NAME: vm1
      PORT: 5000
      TB_ENABLE: "true"
      TB_HOST: "thingsboard"
      TB_PORT: 1883
      TB_TOKEN: "VM1_TOKEN"  # set your device token here or via environment
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    ports:
      - "5001:5000"

  vm2:
    build: .
    image: iot_project-vm2:latest
    container_name: vm2_container
    command: python scripts/vm_server.py
    environment:
      VM_NAME: vm2
      PORT: 5000
      TB_ENABLE: "true"
      TB_HOST: "thingsboard"
      TB_PORT: 1883
      TB_TOKEN: "VM2_TOKEN"  # set your device token here or via environment
    cpus: 2.0
    mem_limit: 1024m
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    ports:
      - "5002:5000"

  vm3:
    build: .
    image: iot_project-vm3:latest
    container_name: vm3_container
    command: python scripts/vm_server.py
    environment:
      VM_NAME: vm3
      PORT: 5000
      TB_ENABLE: "true"
      TB_HOST: "thingsboard"
      TB_PORT: 1883
      TB_TOKEN: "VM3_TOKEN"  # set your device token here or via environment
    cpus: 2.0
    mem_limit: 2048m
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    ports:
      - "5003:5000"
